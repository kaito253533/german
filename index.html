<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch 學習站</title>
<meta name="description" content="依 CEFR 等級整理的德語教學手冊：文法、單字、對話、閱讀與測驗。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#18202E; --muted:#596377; --line:#DCE1E9; --soft:#EBEEF3;
  --mark:#FFE14D; --mark-ink:#18202E; --btn:#18202E; --btn-ink:#FFFFFF;
  --f-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{--bg:#11151C;--surface:#191E28;--ink:#E7EAF0;--muted:#9BA4B6;--line:#2B3241;--soft:#222937;--mark:#6B5A00;--mark-ink:#FFF4B8;--btn:#E7EAF0;--btn-ink:#11151C;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding:56px max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.1;margin:0 0 14px;letter-spacing:-.02em}
h1 mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;padding:0 4px}
.lead{font-size:1.08rem;max-width:60ch;color:var(--muted);margin:0 0 40px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.lv{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:6px;min-width:0;color:inherit;text-decoration:none}
a.lv:hover{border-color:var(--ink)}
a.lv:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.code{font-family:var(--f-mono);font-weight:600;font-size:.9rem;align-self:flex-start;padding:2px 10px;border-radius:6px;background:var(--mark);color:var(--mark-ink)}
.lv.soon .code{background:var(--soft);color:var(--muted)}
.lv h2{font-family:var(--f-display);font-size:1.4rem;margin:8px 0 0}
.lv p{margin:0;color:var(--muted);font-size:.95rem}
.meta{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-top:auto;padding-top:14px;border-top:1px dashed var(--line)}
.go{font-weight:700;color:var(--ink)}
footer{margin-top:56px;font-size:.85rem;color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">Deutsch lernen</p>
  <h1>一步一步學<mark>德語</mark></h1>
  <p class="lead">依歐洲語言共同參考架構（CEFR）分級整理。每個等級都有文法說明、單字、情境對話、短文閱讀和章節測驗，例句都能朗讀。</p>

  <div class="levels">
    <a class="lv" href="a1/">
      <span class="code">A1</span>
      <h2>入門</h2>
      <p>自我介紹、購物、問路、約時間。現在式、冠詞、格位、情態動詞、完成式。</p>
      <span class="meta">20 章 · 200 個單字 · <span class="go">開始學習 →</span></span>
    </a>
    <div class="lv soon" aria-disabled="true">
      <span class="code">A2</span>
      <h2>基礎</h2>
      <p>從屬子句、形容詞變化、反身動詞、過去式。</p>
      <span class="meta">準備中</span>
    </div>
    <div class="lv soon" aria-disabled="true">
      <span class="code">B1</span>
      <h2>進階</h2>
      <p>被動式、虛擬式 II、關係子句、表達意見。</p>
      <span class="meta">準備中</span>
    </div>
  </div>

  <footer>由 <a href="https://kaito253533.github.io/">Lexi LU</a> 整理 · 章節範圍參考 Goethe-Institut 考試說明</footer>
</main>
</body>
</html>
